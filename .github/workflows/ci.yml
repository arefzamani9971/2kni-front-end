name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - uses: nrwl/nx-set-shas@v4
      - name: Lint, typecheck, test (affected)
        run: pnpm nx affected -t lint typecheck test --parallel=3
      - name: Contracts are up to date with openapi.json
        run: pnpm gen:contracts && git diff --exit-code packages/shared/contracts/src/generated
      - name: Build apps (mock mode)
        run: pnpm nx run-many -t build --projects=@dukani/seller,@dukani/customer,@dukani/landing
        env: { NEXT_PUBLIC_API_MODE: mock }
      - name: Storybook
        run: pnpm build-storybook

  docker:
    if: github.event_name == 'push'
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { app: seller, target: server }
          - { app: customer, target: server }
          - { app: landing, target: landing }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: ${{ matrix.target }}
          build-args: APP=${{ matrix.app }}
          tags: dukani/${{ matrix.app }}:${{ github.sha }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
