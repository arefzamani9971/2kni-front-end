# Edge nginx for 2kni.ir: TLS, compression, caching and routing to the three apps.
worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 2048;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  client_max_body_size 12m; # invoice photos / PDFs (10MB rule + multipart overhead)

  log_format main '$remote_addr - [$time_local] "$request" $status $body_bytes_sent $request_time "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json font/woff2;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
  }

  # Rate limit for the auth BFF (OTP abuse is also limited by the API).
  limit_req_zone $binary_remote_addr zone=bff_auth:10m rate=10r/m;

  include /etc/nginx/conf.d/*.conf;
}
