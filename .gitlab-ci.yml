workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^seller-.+/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        DEPLOY_APP: seller
        PUBLIC_URL: https://shop.2kni.ir
    - if: '$CI_COMMIT_TAG =~ /^customer-.+/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        DEPLOY_APP: customer
        PUBLIC_URL: https://customer.2kni.ir
    - if: '$CI_COMMIT_TAG =~ /^landing-.+/ && $CI_COMMIT_REF_PROTECTED == "true"'
      variables:
        DEPLOY_APP: landing
        PUBLIC_URL: https://2kni.ir
    - when: never

stages: [validate, test, release]

default:
  tags: [2kni-production]
  interruptible: false

variables:
  GIT_DEPTH: "0"
  DOCKER_HOST: unix:///var/run/docker.sock
  DOCKER_TLS_CERTDIR: ""
  NX_DAEMON: "false"
  NX_PARALLEL: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Product feature gate, independent of the Git release tag.
  FRONTEND_PRODUCT_RELEASE: "1.0"

validate-tag:
  stage: validate
  image: docker:29.1.3-cli
  script:
    - sh deploy/ci/require-main.sh

quality:
  stage: test
  image: node:22-alpine
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - pnpm nx run-many -t lint typecheck test --parallel=1

release:
  stage: release
  image: docker:29.1.3-cli
  resource_group: production
  environment:
    name: production/$DEPLOY_APP
    url: $PUBLIC_URL
  timeout: 2h
  before_script:
    - apk add --no-cache curl
  script:
    - sh deploy/ci/require-main.sh
    - sh deploy/ci/release.sh
